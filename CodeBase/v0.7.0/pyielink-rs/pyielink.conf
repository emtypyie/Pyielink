# PYIELINK FRAMEWORK - explicit container config
#
# Edit values here and rebuild/restart. This file is mounted into the
# container and read by the entrypoint (no hidden .env file is needed).
# Any value can still be overridden per-run by passing it to `docker compose`
# as a normal shell variable, e.g.:
#   docker compose run --rm -e PYIELINK_HOST=192.168.1.50 view

# Port used by the data layer (screen stream).
PYIELINK_DL_PORT=4243

# Required for the `view` service: IP/address of the host running pyielink.
#   docker compose run --rm -e PYIELINK_HOST=<host-ip> view
PYIELINK_HOST=192.168.1.50

# Optional fixed session key. Leave empty to auto-generate and persist in the
# pyielink-data volume (host and view then share it automatically).
PYIELINK_KEY=
