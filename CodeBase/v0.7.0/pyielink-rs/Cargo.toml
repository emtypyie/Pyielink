[package]
name = "pyielink"
version = "0.7.0"
edition = "2024"

[lib]
name = "pyielink"
path = "src/lib.rs"

[[bin]]
name = "pyielink-cli"
path = "src/cli.rs"

[features]
default = []
gui = ["dep:eframe", "dep:anyhow"]

[dependencies]
rand = "0.8"
sha2 = "0.10"
aes-gcm = "0.10"
argon2 = "0.5"
tungstenite = "0.24"
rustls = { version = "0.23", default-features = false, features = ["std", "tls12"] }
webpki-roots = "0.26"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
eframe = { version = "0.29", features = ["wgpu"], optional = true }
anyhow = { version = "1.0", optional = true }
thiserror = "1.0"
base64 = "0.21"
winapi = { version = "0.3", features = ["minwindef", "winbase", "winnt", "handleapi", "synchapi", "processthreadsapi", "jobapi2", "securitybaseapi"] }

constant_time_eq = "0.6"

[profile.release]
opt-level = "s"
lto = true
strip = true
