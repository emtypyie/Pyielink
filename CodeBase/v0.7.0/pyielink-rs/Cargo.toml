[package]
name = "pyielink"
version = "0.7.0"
edition = "2024"

[lib]
name = "pyielink"
path = "src/lib.rs"

[[bin]]
name = "pyielink-cli"
path = "src/cli.rs"

[features]
default = []
# Native file-explorer GUI (egui/eframe). `explorer` without `--repl` needs this.
gui = ["dep:eframe", "dep:anyhow"]

[dependencies]
rand = "0.8"
sha2 = "0.10"
aes-gcm = "0.10"
tungstenite = "0.24"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
eframe = { version = "0.29", features = ["wgpu"], optional = true }
anyhow = { version = "1.0", optional = true }

[profile.release]
opt-level = "s"
lto = true
strip = true
