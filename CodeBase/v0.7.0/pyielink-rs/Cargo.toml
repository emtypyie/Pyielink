[package]
name = "pyielink"
version = "0.7.0"
edition = "2024"

[lib]
name = "pyielink"
path = "src/lib.rs"

[[bin]]
name = "pyielink-cli"
path = "src/cli.rs"

[dependencies]
rand = "0.8"
sha2 = "0.10"
aes-gcm = "0.10"
tungstenite = "0.24"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[profile.release]
opt-level = "s"
lto = true
strip = true
