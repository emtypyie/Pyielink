# PYIELINK FRAMEWORK v0.7.0 — host + viewer
#
# Build:            docker compose build
# Host (share screen):   docker compose up -d host
# Viewer (watch screen): docker compose run --rm view
#   edit pyielink.conf with the host IP, then:
#     docker compose run --rm view
#   (or override per run: docker compose run --rm -e PYIELINK_HOST=<host-ip> view)
#   On headless machines the entrypoint starts Xvfb automatically.
#
# Settings come from the explicit config file pyielink.conf (mounted read-only);
# no hidden .env file is used. Any of them can be overridden per-run with a
# normal shell variable passed to docker compose.
#
# The session key is generated once and persisted in the `pyielink-data`
# volume, so host + view stay paired across restarts.

services:
  host:
    build: .
    image: pyielink-framework:latest
    container_name: pyielink-host
    command: ["host"]
    restart: unless-stopped
    init: true
    volumes:
      - ./pyielink.conf:/app/pyielink.conf:ro
      - pyielink-data:/data

  view:
    image: pyielink-framework:latest
    container_name: pyielink-view
    command: ["view"]
    init: true
    volumes:
      - ./pyielink.conf:/app/pyielink.conf:ro
      - pyielink-data:/data
    depends_on:
      - host

volumes:
  pyielink-data:
