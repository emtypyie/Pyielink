# PYIELINK FRAMEWORK v0.7.0 — host + viewer
#
# Build:            docker compose build
# Host (share screen):   docker compose up -d host
# Viewer (watch screen): docker compose run --rm view
#   set PYIELINK_HOST=<host-ip> in .env (or shell) before running `view`.
#   On headless machines the entrypoint starts Xvfb automatically.
#
# The session key is generated once and persisted in the `pyielink-data`
# volume, so host + view stay paired across restarts.

services:
  host:
    build: .
    image: pyielink-framework:latest
    container_name: pyielink-host
    command: ["host"]
    restart: unless-stopped
    init: true
    environment:
      - PYIELINK_DL_PORT=${PYIELINK_DL_PORT:-4243}
      - PYIELINK_KEY=${PYIELINK_KEY:-}
    volumes:
      - pyielink-data:/data

  view:
    image: pyielink-framework:latest
    container_name: pyielink-view
    command: ["view"]
    init: true
    environment:
      - PYIELINK_HOST=${PYIELINK_HOST:?set PYIELINK_HOST=<host-ip> in .env or shell}
      - PYIELINK_DL_PORT=${PYIELINK_DL_PORT:-4243}
      - PYIELINK_KEY=${PYIELINK_KEY:-}
    volumes:
      - pyielink-data:/data
    depends_on:
      - host

volumes:
  pyielink-data:
