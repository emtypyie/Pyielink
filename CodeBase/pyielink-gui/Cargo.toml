[package]
name = "pyielink-gui"
version = "0.1.0-alpha.4"
edition = "2024"
description = "Native egui + wgpu viewer for pyielink remote sessions"

[dependencies]
pyielink = { path = "../pyielink-rs" }
egui = { version = "0.29", features = ["accesskit"] }
eframe = { version = "0.29", features = ["wgpu"] }
wgpu = { version = "23", features = ["dx12"] }
openh264 = "0.5"
tokio = { version = "1", features = ["rt-multi-thread", "sync"] }
anyhow = "1.0"
walkdir = "2"

[profile.release]
opt-level = 3
lto = true
strip = true